[[redirects]]
  from = "/api/archetype-scores"
  to = "/.netlify/functions/archetype-scores"
  status = 200
  force = true

[[redirects]]
  from = "/api/signup"
  to = "/.netlify/functions/user-auth?action=signup"
  status = 200
  force = true

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/user-auth?action=login"
  status = 200
  force = true

[[redirects]]
  from = "/api/user/*"
  to = "/.netlify/functions/user-auth?action=user&path=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/curiosa/*"
  to = "https://curiosa.io/:splat"
  status = 200
  force = true
  [redirects.headers]
    Origin = "https://curiosa.io"
    Referer = "https://curiosa.io/"

[[redirects]]
  from = "/api/sorcery/*"
  to = "https://api.sorcerytcg.com/api/:splat"
  status = 200
  force = true

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
